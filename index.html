    ::-webkit-scrollbar-thumb { background: #c5c5c5; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

</head>
<body class="bg-stone-900 text-stone-800 min-h-screen flex flex-col items-center justify-start p-2 sm:p-4">

  <!-- Hidden container for offscreen QR code generator -->
  <div id="qrcode-temp" class="hidden"></div>

  <!-- Header -->
  <header class="w-full max-w-6xl mb-3 flex items-center justify-between bg-stone-800 text-white p-4 rounded-xl shadow-md border border-stone-700">
    <div class="flex items-center gap-3">

        <i class="fa-solid fa-award"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold leading-tight">BSA Merit Badge Sash Generator</h1>
        <p class="text-xs text-stone-400">Interactive 3-Column Layout Builder (48 Slots)</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="save-btn" class="px-3 py-1.5 bg-stone-700 hover:bg-stone-600 text-white rounded-lg text-xs font-semibold shadow transition flex items-center gap-1.5">
        <i class="fa-solid fa-copy"></i> Copy Code
      </button>
      <button id="load-btn" class="px-3 py-1.5 bg-stone-700 hover:bg-stone-600 text-white rounded-lg text-xs font-semibold shadow transition flex items-center gap-1.5">
        <i class="fa-solid fa-file-import"></i> Load Code
      </button>
      <button id="image-read-btn" class="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-600 text-white rounded-lg text-xs font-semibold shadow transition flex items-center gap-1.5">
        <i class="fa-solid fa-qrcode"></i> Image Read
      </button>
      <input type="file" id="image-upload-input" accept="image/png, image/jpeg, image/webp" class="hidden">
    </div>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 bg-white rounded-2xl shadow-2xl overflow-hidden border border-stone-300">
    
    <!-- Left Column: Interactive Sash Preview Container -->
    <section class="lg:col-span-7 p-4 md:p-6 flex flex-col items-center bg-stone-100 border-b lg:border-b-0 lg:border-r border-stone-200 relative overflow-y-auto max-h-[85vh]">
      
      <!-- Controls Bar -->
      <div class="w-full max-w-md flex items-center justify-between gap-2 mb-4 bg-white p-3 rounded-xl shadow-sm border border-stone-200">
        <span id="badge-count-tag" class="text-xs font-bold text-stone-700 bg-stone-100 px-3 py-1.5 rounded-lg border border-stone-200">
          0 / 48 Badges
        </span>
        <div class="flex items-center gap-2">
          <button id="flip-btn" class="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-xs font-semibold shadow transition flex items-center gap-1.5">
            <i class="fa-solid fa-rotate"></i> Flip Sash (Back)
          </button>
          <button id="reset-btn" class="px-3 py-1.5 bg-stone-200 hover:bg-stone-300 text-stone-700 rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-rotate-left"></i> Reset
          </button>
          <button id="download-btn" class="px-3 py-1.5 bg-stone-900 hover:bg-black text-white rounded-lg text-xs font-semibold shadow transition flex items-center gap-1.5">
            <i class="fa-solid fa-download"></i> Export PNG
          </button>
        </div>
      </div>

      <!-- Sash Canvas Viewport -->
      <div class="relative flex justify-center w-full my-auto py-2">
        <canvas id="sash-canvas" width="450" height="1850" class="w-[380px] sm:w-[420px] md:w-[450px] aspect-[450/1850] drop-shadow-xl cursor-pointer rounded-lg bg-transparent"></canvas>
      </div>
    </section>

    <!-- Right Column: Merit Badge Palette -->
    <section class="lg:col-span-5 p-4 md:p-6 flex flex-col bg-white overflow-hidden max-h-[85vh]">
      
      <!-- Palette Search & Clear Header -->
      <div class="mb-4 flex gap-2">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-stone-400 text-sm"></i>
          <input type="text" id="search-input" placeholder="Search merit badges..." class="w-full pl-10 pr-4 py-2 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-white transition">
        </div>
        <button id="clear-slot-btn" class="px-3.5 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 shadow-sm whitespace-nowrap">

      </div>

        <!-- Badge items populated by JavaScript -->

    </section>

    let isFlipped = false;
    let selectedSlotIndex = 0;
    const placedBadges = new Array(TOTAL_SLOTS).fill(null);
    const loadedImages = {};

    function loadBadgeImages() {
      MERIT_BADGES.forEach(badge => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          loadedImages[badge.id] = img;
          drawSashOnContext();
          renderBadgePalette(document.getElementById('search-input')?.value || '');
        };
        img.src = badge.imageUrl;

        if (badge.variants) {
          badge.variants.forEach(variant => {
            const vImg = new Image();
            vImg.crossOrigin = "anonymous";
            vImg.onload = () => {
              loadedImages[variant.id] = vImg;
              drawSashOnContext();
              renderBadgePalette(document.getElementById('search-input')?.value || '');
            };
            vImg.src = variant.imageUrl;
          });
        }
      });
    }

    function getSlotCoordinates(slotIndex, customWidth = 450) {
      const col = slotIndex % COLS;
      const row = Math.floor(slotIndex / COLS) + START_ROW;
      const topMargin = 120;
      const rowHeight = 88;
      const colWidth = 100;
      const startX = (customWidth - (COLS * colWidth)) / 2 + (colWidth / 2);
      return { x: startX + (col * colWidth), y: topMargin + (row * rowHeight), radius: 36 };
    }

    // Generic drawing function accepting any canvas context (screen or 3x offscreen)
    function drawSashOnContext(ctx = null, isExporting = false) {
      const canvas = document.getElementById('sash-canvas');
      if (!ctx && canvas) ctx = canvas.getContext('2d');
      if (!ctx) return;

      const w = 450;
      const h = 1850;

      ctx.clearRect(0, 0, w, h);

      const sashWidth = 340;
      const sashLeft = (w - sashWidth) / 2;
      const sashRight = sashLeft + sashWidth;
      const bodyBottom = 1570;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(sashLeft, 40);
      ctx.lineTo(sashRight, 40);
      ctx.lineTo(sashRight, bodyBottom);

      if (!isFlipped) {
        ctx.lineTo(sashLeft, bodyBottom + 180);
      } else {
        ctx.lineTo(sashRight, bodyBottom + 180);
        ctx.lineTo(sashLeft, bodyBottom);
      }
      ctx.closePath();

      ctx.fillStyle = '#223824';
      ctx.fill();

      ctx.strokeStyle = '#18281a';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = '#365339';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      for (let i = 0; i < TOTAL_SLOTS; i++) {
        const { x, y, radius } = getSlotCoordinates(i, w);
        const placedBadgeId = placedBadges[i];

        if (placedBadgeId && loadedImages[placedBadgeId]) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.clip();

          const img = loadedImages[placedBadgeId];
          ctx.drawImage(img, x - radius, y - radius, radius * 2, radius * 2);
          ctx.restore();
        } else if (!isExporting) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.strokeStyle = (i === selectedSlotIndex) ? '#f59e0b' : 'rgba(255, 255, 255, 0.25)';
          ctx.lineWidth = (i === selectedSlotIndex) ? 3 : 1.5;
          if (i !== selectedSlotIndex) ctx.setLineDash([4, 4]);
          ctx.stroke();

          ctx.fillStyle = (i === selectedSlotIndex) ? '#f59e0b' : 'rgba(255, 255, 255, 0.4)';
          ctx.font = '600 13px Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText((i + 1).toString(), x, y);
          ctx.restore();
        }
      }

      const countTag = document.getElementById('badge-count-tag');
      if (countTag && !isExporting) {
        const count = placedBadges.filter(Boolean).length;
        countTag.textContent = `${count} / ${TOTAL_SLOTS} Badges`;
      }
    }

    function renderBadgePalette(filterQuery = '') {
      const palette = document.getElementById('badge-palette');
      if (!palette) return;
      palette.innerHTML = '';

      const query = filterQuery.toLowerCase().trim();
      MERIT_BADGES.filter(b => b.name.toLowerCase().includes(query)).forEach(badge => {
        const isMainPlaced = placedBadges.includes(badge.id);
        const placedVariant = badge.variants ? badge.variants.find(v => placedBadges.includes(v.id)) : null;
        const isAnyPlaced = isMainPlaced || !!placedVariant;

        const card = document.createElement('div');
        card.className = `relative flex flex-col items-center justify-between p-3 rounded-xl border transition cursor-pointer select-none h-auto ${
          isAnyPlaced ? 'bg-stone-100 border-stone-200 opacity-60' : 'bg-white hover:bg-stone-50 border-stone-200 hover:border-emerald-600 shadow-sm hover:shadow'
        }`;

        if (badge.variants && badge.variants.length > 0) {
          const dotsBtn = document.createElement('button');
          dotsBtn.className = 'absolute top-2 right-2 w-6 h-6 flex items-center justify-center text-stone-400 hover:text-stone-800 rounded-full hover:bg-stone-100 transition z-20';
          dotsBtn.innerHTML = '<i class="fa-solid fa-ellipsis-vertical text-xs"></i>';
          
          const popup = document.createElement('div');
          popup.className = 'hidden absolute top-9 left-1 right-1 w-auto bg-emerald-800 text-white rounded-xl shadow-xl border border-emerald-700 p-2 z-30 text-left';
          
          const popupTitle = document.createElement('div');
          popupTitle.className = 'text-[10px] font-bold uppercase tracking-wider text-emerald-200 mb-1.5 border-b border-emerald-700 pb-1';
          popupTitle.textContent = 'Select Variant';
          popup.appendChild(popupTitle);

          const defaultOption = document.createElement('div');
          defaultOption.className = 'flex items-center gap-2 p-1.5 rounded-lg hover:bg-emerald-700 transition cursor-pointer mb-1';
          const stdImgSrc = loadedImages[badge.id]?.src || '';
          defaultOption.innerHTML = `
            <img src="${stdImgSrc}" class="w-6 h-6 rounded-full object-cover shrink-0 border border-emerald-500 bg-white shadow-sm">
            <div class="flex flex-col min-w-0 flex-1">
              <span class="text-xs font-semibold leading-tight whitespace-normal">${badge.name}</span>
              <span class="text-[9px] text-emerald-200">Current Standard</span>
            </div>
          `;
          defaultOption.addEventListener('click', (e) => {
            e.stopPropagation();
            popup.classList.add('hidden');
            if (!isAnyPlaced) attachBadgeToSlot(badge.id);
          });
          popup.appendChild(defaultOption);

          badge.variants.forEach((variant) => {
            const option = document.createElement('div');
            option.className = 'flex items-center gap-2 p-1.5 rounded-lg hover:bg-emerald-700 transition cursor-pointer';
            const varImgSrc = loadedImages[variant.id]?.src || '';
            option.innerHTML = `
              <img src="${varImgSrc}" class="w-6 h-6 rounded-full object-cover shrink-0 border border-amber-400 bg-white shadow-sm">
              <div class="flex flex-col min-w-0 flex-1">
                <span class="text-xs font-semibold leading-tight whitespace-normal">${variant.name}</span>
                <span class="text-[9px] text-amber-200">${variant.years || 'Alt Design'}</span>
              </div>
            `;
            option.addEventListener('click', (e) => {
              e.stopPropagation();
              popup.classList.add('hidden');
              if (!isAnyPlaced) attachBadgeToSlot(variant.id);
            });
            popup.appendChild(option);
          });

          dotsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('#badge-palette .popup-menu').forEach(p => p.classList.add('hidden'));
            popup.classList.toggle('hidden');
          });

          popup.classList.add('popup-menu');
          card.appendChild(dotsBtn);
          card.appendChild(popup);
        }

        const imgContainer = document.createElement('div');
        imgContainer.className = 'w-14 h-14 rounded-full overflow-hidden mb-2 shadow-sm flex items-center justify-center bg-stone-100 border border-stone-200';

        const activeBadgeId = placedVariant ? placedVariant.id : badge.id;
        if (loadedImages[activeBadgeId]) {
          const img = document.createElement('img');
          img.src = loadedImages[activeBadgeId].src;
          img.className = 'w-full h-full object-cover';
          imgContainer.appendChild(img);
        } else {
          const placeholder = document.createElement('div');
          placeholder.className = 'w-full h-full bg-stone-200 animate-pulse';
          imgContainer.appendChild(placeholder);
        }

        const title = document.createElement('span');
        title.className = 'text-xs font-semibold text-center text-stone-800 leading-tight whitespace-normal px-1';
        title.textContent = placedVariant ? placedVariant.name : badge.name;

        card.appendChild(imgContainer);
        card.appendChild(title);

        if (isAnyPlaced) {
          const placedTag = document.createElement('span');
          placedTag.className = 'mt-1.5 text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200';
          placedTag.textContent = 'Placed';
          card.appendChild(placedTag);
        } else {
          card.addEventListener('click', () => attachBadgeToSlot(badge.id));
        }

        palette.appendChild(card);
      });
    }

    function attachBadgeToSlot(badgeId) {
      if (selectedSlotIndex < 0 || selectedSlotIndex >= TOTAL_SLOTS) return;
      placedBadges[selectedSlotIndex] = badgeId;

      const nextEmpty = placedBadges.findIndex((b, idx) => idx > selectedSlotIndex && b === null);
      if (nextEmpty !== -1) {
        selectedSlotIndex = nextEmpty;
      } else {
        const anyEmpty = placedBadges.findIndex(b => b === null);
        if (anyEmpty !== -1) selectedSlotIndex = anyEmpty;
      }

      drawSashOnContext();
      renderBadgePalette(document.getElementById('search-input')?.value || '');
    }

    function exportSashCode() {
      return placedBadges.map(badgeId => {
        if (!badgeId) return "0000";
        
        for (let i = 0; i < MERIT_BADGES.length; i++) {
          const b = MERIT_BADGES[i];
          if (b.id === badgeId) {
            return (i + 1).toString().padStart(3, '0') + '0';
          }
          if (b.variants) {
            const vIndex = b.variants.findIndex(v => v.id === badgeId);
            if (vIndex !== -1) {
              return (i + 1).toString().padStart(3, '0') + (vIndex + 1).toString();
            }
          }
        }
        return "0000";
      }).join('');
    }

    function importSashCode(codeString) {
      codeString = codeString ? codeString.trim() : '';
      
      if (codeString.length !== TOTAL_SLOTS * 4) {
        alert("Invalid sash code length! Expected exactly 192 characters.");
        return;
      }

      for (let i = 0; i < TOTAL_SLOTS; i++) {
        const chunk = codeString.substr(i * 4, 4);
        if (chunk === "0000") {
          placedBadges[i] = null;
          continue;
        }
        const badgeIndex = parseInt(chunk.substr(0, 3), 10) - 1;
        const variantIndex = parseInt(chunk.substr(3, 1), 10);

        if (badgeIndex >= 0 && badgeIndex < MERIT_BADGES.length) {
          const badge = MERIT_BADGES[badgeIndex];
          if (variantIndex === 0 || !badge.variants || !badge.variants[variantIndex - 1]) {
            placedBadges[i] = badge.id;
          } else {
            placedBadges[i] = badge.variants[variantIndex - 1].id;
          }
        } else {
          placedBadges[i] = null;
        }
      }

      drawSashOnContext();
      renderBadgePalette(document.getElementById('search-input')?.value || '');
    }

    // Helper: Generate QR Data URL using qrcode.js
    function generateQRCodeDataURL(text) {
      const container = document.getElementById('qrcode-temp');
      container.innerHTML = '';
      
      new QRCode(container, {
        text: text,
        width: 300,
        height: 300,
        correctLevel: QRCode.CorrectLevel.M
      });

      const qrCanvas = container.querySelector('canvas');
      if (qrCanvas) return qrCanvas.toDataURL('image/png');
      const qrImg = container.querySelector('img');
      return qrImg ? qrImg.src : '';
    }

    window.onload = function() {
      const canvas = document.getElementById('sash-canvas');
      const searchInput = document.getElementById('search-input');
      const flipBtn = document.getElementById('flip-btn');
      const resetBtn = document.getElementById('reset-btn');
      const downloadBtn = document.getElementById('download-btn');
      const clearSlotBtn = document.getElementById('clear-slot-btn');
      const saveBtn = document.getElementById('save-btn');
      const loadBtn = document.getElementById('load-btn');
      const imageReadBtn = document.getElementById('image-read-btn');
      const imageUploadInput = document.getElementById('image-upload-input');

      if (canvas) {
        canvas.addEventListener('click', (e) => {
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          const clickX = (e.clientX - rect.left) * scaleX;
          const clickY = (e.clientY - rect.top) * scaleY;

          for (let i = 0; i < TOTAL_SLOTS; i++) {
            const { x, y, radius } = getSlotCoordinates(i, canvas.width);
            if (Math.hypot(clickX - x, clickY - y) <= radius + 5) {
              selectedSlotIndex = i;
              drawSashOnContext();
              break;
            }
          }
        });
      }

      if (searchInput) {
        searchInput.addEventListener('input', (e) => renderBadgePalette(e.target.value));
      }

      if (clearSlotBtn) {
        clearSlotBtn.addEventListener('click', () => {
          if (selectedSlotIndex >= 0 && selectedSlotIndex < TOTAL_SLOTS) {
            placedBadges[selectedSlotIndex] = null;
            drawSashOnContext();
            renderBadgePalette(searchInput ? searchInput.value : '');
          }
        });
      }

      if (saveBtn) {
        saveBtn.addEventListener('click', () => {
          const code = exportSashCode();
          navigator.clipboard.writeText(code);
          alert("Sash code copied to clipboard!\n\n" + code);
        });
      }

      if (loadBtn) {
        loadBtn.addEventListener('click', () => {
          const code = prompt("Paste your sash code here:");
          if (code) importSashCode(code);
        });
      }

      // --- HIGH-RES 3X CANVAS EXPORT WITH CORNER QR CODE STAMP ---
      if (downloadBtn) {
        downloadBtn.addEventListener('click', () => {
          const code = exportSashCode();
          const scale = 3;

          const exportCanvas = document.createElement('canvas');
          exportCanvas.width = 450 * scale;   // 1350px
          exportCanvas.height = 1850 * scale; // 5550px
          const ctx = exportCanvas.getContext('2d');
          
          ctx.scale(scale, scale);

          // 1. Render main sash layout at standard coordinates onto 3x scaled canvas
          drawSashOnContext(ctx, true);

          // 2. Generate and stamp 100x100 visual QR code in bottom margin
          const qrDataUrl = generateQRCodeDataURL(code);
          const qrImg = new Image();
          qrImg.onload = () => {
            // Positioned at bottom right corner (x = 320, y = 1710, size = 100px)
            ctx.drawImage(qrImg, 320, 1710, 100, 100);

            // 3. Trigger PNG Download
            const link = document.createElement('a');
            link.download = 'my-merit-badge-sash.png';
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
          };
          qrImg.src = qrDataUrl;
        });
      }

      // --- QR CODE SCANNER USING jsQR LIBRARY ---
      if (imageReadBtn && imageUploadInput) {
        imageReadBtn.addEventListener('click', () => imageUploadInput.click());

        imageUploadInput.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = function(evt) {
            const img = new Image();
            img.onload = function() {
              const scanCanvas = document.createElement('canvas');
              scanCanvas.width = img.width;
              scanCanvas.height = img.height;
              const scanCtx = scanCanvas.getContext('2d');
              scanCtx.drawImage(img, 0, 0);

              const imageData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
              
              // Scan for QR code using jsQR
              const qrResult = jsQR(imageData.data, imageData.width, imageData.height);

              if (qrResult && qrResult.data) {
                importSashCode(qrResult.data);
                alert("Successfully loaded sash layout from embedded QR Code!");
              } else {
                alert("No readable sash QR code detected in this image!");
              }
              imageUploadInput.value = '';
            };
            img.src = evt.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      if (flipBtn) {
        flipBtn.addEventListener('click', () => { isFlipped = !isFlipped; drawSashOnContext(); });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          placedBadges.fill(null);
          selectedSlotIndex = 0;
          drawSashOnContext();
          renderBadgePalette(searchInput ? searchInput.value : '');
        });
      }

      document.addEventListener('click', () => {
        document.querySelectorAll('#badge-palette .popup-menu').forEach(p => p.classList.add('hidden'));
      });

      drawSashOnContext();
      renderBadgePalette();
      loadBadgeImages();
    };
  </script>
</body>
</html>
